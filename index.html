<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Black Hole Void Orb - AR</title>

  <!-- 1. A-Frame: the 3D engine -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- 2. AR.js: adds camera + marker tracking to A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
    // ---------- Component 1: tap an object to change its colour ----------
    AFRAME.registerComponent('color-changer', {
      init: function () {
        const colors = ['#EF2D5E', '#FFC65D', '#4CC3D9', '#7BC8A4', '#9B59B6'];
        let index = 0;
        this.el.addEventListener('click', () => {
          index = (index + 1) % colors.length;      // go to next colour
          this.el.setAttribute('color', colors[index]);
        });
      }
    });

    // ---------- Component 2: tap the orb to grow the vortex and show a warning ----------
    AFRAME.registerComponent('void-grow', {
      schema: { target: { type: 'selector' } },
      init: function () {
        const warning = document.querySelector('#warning');
        let grown = false;
        this.el.addEventListener('click', () => {
          grown = !grown;                           // flip between big and small
          this.data.target.setAttribute('scale', grown ? '1.5 1.5 1.5' : '1 1 1');
          warning.setAttribute('visible', grown);
        });
      }
    });

    // ---------- Component 3: builds the vortex arms and sparks ----------
    AFRAME.registerComponent('void-build', {
      init: function () {
        const root = this.el;
        function add(tag, attrs, parent) {
          const e = document.createElement(tag);
          for (const k in attrs) e.setAttribute(k, attrs[k]);
          parent.appendChild(e);
          return e;
        }
        const flat = (c, o) => 'shader: flat; transparent: true; side: double; color: ' + c + '; opacity: ' + o;

        // soft glow circles behind the vortex
        add('a-circle', { radius: 0.85, position: '0 0 -0.03', material: flat('#5B4BDB', 0.14) }, root);
        add('a-circle', { radius: 0.62, position: '0 0 -0.02', material: flat('#6A5ACD', 0.22) }, root);

        // swirl arms: 3 layers of arcs that spin at different speeds
        const layers = [
          { inner: 0.52, outer: 0.74, dur: 9000, dir:  1, col: '#9C8CFF', op: 0.40, len: 75 },
          { inner: 0.40, outer: 0.54, dur: 6000, dir: -1, col: '#7B6CF5', op: 0.50, len: 100 },
          { inner: 0.31, outer: 0.42, dur: 4000, dir:  1, col: '#C4B8FF', op: 0.55, len: 60 }
        ];
        layers.forEach((L, i) => {
          const g = add('a-entity', {
            position: '0 0 ' + (i * 0.005),
            animation: 'property: rotation; to: 0 0 ' + (360 * L.dir) + '; dur: ' + L.dur + '; easing: linear; loop: true'
          }, root);
          [0, 120, 240].forEach(start => {
            add('a-ring', {
              'radius-inner': L.inner, 'radius-outer': L.outer,
              'theta-start': start + i * 25, 'theta-length': L.len,
              material: flat(L.col, L.op)
            }, g);
          });
        });

        // sparks: small white streaks that drift toward the centre
        for (let n = 0; n < 32; n++) {
          const a = Math.random() * Math.PI * 2;
          const r = 0.2 + Math.random() * 0.6;
          const z = (Math.random() - 0.5) * 0.25;
          const x1 = Math.cos(a) * r, y1 = Math.sin(a) * r;
          const x2 = Math.cos(a) * r * 0.8, y2 = Math.sin(a) * r * 0.8;
          add('a-box', {
            width: 0.07, height: 0.006, depth: 0.006,
            position: x1 + ' ' + y1 + ' ' + z,
            rotation: '0 0 ' + (a * 180 / Math.PI),
            material: 'shader: flat; color: #FFFFFF',
            animation: 'property: position; from: ' + x1 + ' ' + y1 + ' ' + z +
                       '; to: ' + x2 + ' ' + y2 + ' ' + z +
                       '; dir: alternate; loop: true; easing: easeInOutQuad; dur: ' +
                       (900 + Math.floor(Math.random() * 1800))
          }, root);
        }
      }
    });

    // ---------- Component 4: show whether the marker is visible ----------
    AFRAME.registerComponent('marker-status', {
      init: function () {
        const banner = document.querySelector('#status');
        this.el.addEventListener('markerFound', () => {
          banner.textContent = 'Void FOUND - tap the glowing orb or the star!';
          banner.style.background = '#2E7D32';
        });
        this.el.addEventListener('markerLost', () => {
          banner.textContent = 'Void LOST - point the camera at the Hiro marker';
          banner.style.background = '#C62828';
        });
      }
    });
  </script>
</head>

<body>
  <div id="status">Looking for the Hiro marker...</div>

  <a-scene embedded vr-mode-ui="enabled: false"
           arjs="sourceType: webcam; debugUIEnabled: false;">

    <!-- Assets are loaded BEFORE the scene starts -->
    <a-assets timeout="20000">
      <!-- Milk truck model (CC BY 4.0, credited in README.md) -->
      <a-asset-item id="truck-model"
        src="https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Models/master/2.0/CesiumMilkTruck/glTF-Binary/CesiumMilkTruck.glb">
      </a-asset-item>
    </a-assets>

    <!-- Everything inside <a-marker> appears ON the Hiro marker -->
    <a-marker preset="hiro" marker-status>

      <!-- Ground plate (a plane lying flat on the marker) -->
      <a-plane rotation="-90 0 0" width="1.6" height="1.6" color="#0B0B1A"></a-plane>

      <!-- The void: an upright vortex facing the viewer -->
      <a-entity id="vortex" position="0 0.85 0" void-build>

        <!-- Glass orb (class="clickable" lets the ray hit it) -->
        <a-sphere class="clickable" void-grow="target: #vortex" radius="0.3"
                  material="shader: flat; transparent: true; color: #8A7BFF; opacity: 0.35"></a-sphere>

        <!-- Dark core inside the glass orb -->
        <a-sphere radius="0.25"
                  material="shader: flat; transparent: true; color: #1E1065; opacity: 0.9"></a-sphere>

        <!-- Two glowing rings that spin inside the core -->
        <a-torus radius="0.14" radius-tubular="0.012" color="#EDE9FF"
                 material="shader: flat; color: #EDE9FF"
                 animation="property: rotation; to: 0 360 0; dur: 5000; easing: linear; loop: true"></a-torus>
        <a-torus radius="0.11" radius-tubular="0.008" rotation="60 0 0"
                 material="shader: flat; color: #B8A9FF"
                 animation="property: rotation; to: 60 0 360; dur: 3500; easing: linear; loop: true"></a-torus>
      </a-entity>

      <!-- Milk truck that orbits the void (the outer entity spins, the truck sits off to one side) -->
      <a-entity position="0 0.85 0"
                animation="property: rotation; to: 0 360 0;
                           dur: 8000; easing: linear; loop: true">
        <a-entity gltf-model="#truck-model" position="0.95 0 0"
                  scale="0.08 0.08 0.08"></a-entity>
      </a-entity>

      <!-- Tappable, bouncing star (class="clickable" lets the ray hit it) -->
      <a-sphere class="clickable" color-changer
                position="-0.65 0.5 0.2" radius="0.1" color="#EF2D5E"
                animation="property: position; from: -0.65 0.35 0.2; to: -0.65 0.9 0.2;
                           dir: alternate; dur: 700;
                           easing: easeInOutQuad; loop: true"></a-sphere>

      <!-- Text labels -->
      <a-text value="THE VOID ORB" position="0 1.65 0" align="center"
              width="3" color="#C4B8FF"></a-text>
      <a-text id="warning" visible="false"
              value="Nothing escapes the event horizon!"
              position="0 1.45 0" align="center" width="2.4" color="#FFFFFF"></a-text>
    </a-marker>

    <!-- Camera + "tap" detection (cursor uses the touch / mouse position) -->
    <a-entity camera cursor="rayOrigin: mouse" raycaster="objects: .clickable"></a-entity>
  </a-scene>
</body>
</html>
